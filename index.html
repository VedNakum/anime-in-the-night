<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mobile Search Frame</title>

<style>
:root {
    --darkness: 0.35;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    height: 100svh;
    background: black;
    font-family: system-ui, sans-serif;
    overflow: hidden;
}

/* Frame container */
#frame-container {
    position: fixed;
    inset: 0;
    background: black;
}

/* Iframe (NO filters for performance) */
iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Darkness overlay (fast) */
#dark-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, var(--darkness));
    pointer-events: none;
    z-index: 5;
}

/* Bottom controls (mobile-first) */
.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px;
    background: rgba(18, 18, 18, 0.95);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
}

input[type="text"] {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 12px 14px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #3498db;
    color: white;
}

/* Hide UI = pseudo fullscreen */
.fullscreen .controls {
    display: none;
}
</style>
</head>

<body>

<div id="frame-container">
    <iframe
        id="frame"
        loading="eager"
        sandbox="allow-scripts allow-forms"
        referrerpolicy="no-referrer"
    ></iframe>
    <div id="dark-overlay"></div>
</div>

<div class="controls">
    <input
        id="searchInput"
        placeholder="Search…"
        autofocus
    >
    <button onclick="loadSearch()">🔍</button>
    <button onclick="toggleUI()">⛶</button>
    <input
        type="range"
        min="0"
        max="0.6"
        step="0.05"
        value="0.35"
        oninput="setDark(this.value)"
    >
</div>

<script>
const frame = document.getElementById("frame");
const input = document.getElementById("searchInput");
const body = document.body;

/* 🔧 CHANGE THIS TO YOUR SITE */
const BASE_SEARCH_URL = "https://hianimez.org/search?keyword=";

/* Load search */
function loadSearch() {
    const query = input.value.trim();
    if (!query) return;

    // Encode query: spaces → +, symbols safe
    const encoded = encodeURIComponent(query).replace(/%20/g, "+");

    frame.src = BASE_SEARCH_URL + encoded;
}

/* Darkness control */
function setDark(val) {
    document.documentElement.style.setProperty("--darkness", val);
}

/* Pseudo fullscreen */
function toggleUI() {
    body.classList.toggle("fullscreen");
}

/* Enter key triggers search */
input.addEventListener("keydown", e => {
    if (e.key === "Enter") loadSearch();
});
</script>

</body>
</html>

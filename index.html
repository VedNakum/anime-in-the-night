<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fast Mobile Iframe</title>

<style>
:root {
    --darkness: 0.35; /* overlay opacity */
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    height: 100svh;
    background: black;
    font-family: system-ui, sans-serif;
    overflow: hidden;
}

/* Container */
#frame-container {
    position: fixed;
    inset: 0;
    background: black;
}

/* Iframe — NO FILTER (important) */
iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* Darkness Overlay (FAST) */
#dark-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, var(--darkness));
    pointer-events: none;
    z-index: 5;
}

/* Controls */
.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px;
    background: rgba(18,18,18,0.95);
    display: flex;
    gap: 8px;
    align-items: center;
    z-index: 10;
}

input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #222;
    color: white;
}

button {
    padding: 12px 14px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    background: #3498db;
    color: white;
}

/* Hide UI = pseudo fullscreen */
.fullscreen .controls {
    display: none;
}
</style>
</head>

<body>

<div id="frame-container">
    <iframe
        id="frame"
        loading="eager"
        sandbox="allow-scripts allow-forms"
        referrerpolicy="no-referrer"
    ></iframe>
    <div id="dark-overlay"></div>
</div>

<div class="controls">
    <input id="url" value="https://example.com">
    <button onclick="loadSite()">➡️</button>
    <button onclick="toggleUI()">⛶</button>
    <input type="range" min="0" max="0.6" step="0.05" value="0.35" oninput="setDark(this.value)">
</div>

<script>
const frame = document.getElementById("frame");
const urlInput = document.getElementById("url");
const body = document.body;

function loadSite() {
    let url = urlInput.value.trim();
    if (!url.startsWith("http")) url = "https://" + url;
    frame.src = url;
}

function setDark(val) {
    document.documentElement.style.setProperty("--darkness", val);
}

function toggleUI() {
    body.classList.toggle("fullscreen");
}

/* Load default */
loadSite();
</script>

</body>
</html>

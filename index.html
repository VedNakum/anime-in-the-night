<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darkened Mobile Search Frame</title>
    <style>
        :root { --bg-color: #121212; --text-color: #ffffff; }
        body { margin: 0; background: var(--bg-color); color: var(--text-color); font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        /* Search UI */
        .controls { padding: 10px; display: flex; gap: 8px; background: #1a1a1a; border-bottom: 1px solid #333; }
        input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: white; font-size: 16px; }
        button { padding: 10px 15px; border: none; border-radius: 4px; background: #3498db; color: white; cursor: pointer; }
        
        /* The Iframe Wrapper & Dark Filter */
        #frame-container { position: relative; flex: 1; background: black; overflow: hidden; }
        iframe {
            width: 100%; height: 100%; border: none;
            filter: brightness(0.6) contrast(1.1); /* This makes the website darker */
            transition: filter 0.3s ease;
        }

        /* Fullscreen Styling */
        #frame-container:fullscreen { width: 100vw; height: 100vh; }
        #frame-container:fullscreen iframe { filter: brightness(1); } /* Optional: auto-brighten in fullscreen */
        
        /* Pseudo-Fullscreen fallback for Mobile iOS */
        .pseudo-fullscreen {
            position: fixed !important; top: 0; left: 0; 
            width: 100vw !important; height: 100vh !important; 
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="urlInput" placeholder="Enter URL (e.g. https://example.com)" value="https://example.com">
        <button onclick="loadSite()">Go</button>
        <button onclick="toggleFullscreen()">⛶ Full</button>
    </div>

    <div id="frame-container">
        <iframe id="targetFrame" src="https://example.com" allowfullscreen></iframe>
    </div>

    <script>
        const container = document.getElementById('frame-container');
        const frame = document.getElementById('targetFrame');
        const input = document.getElementById('urlInput');

        // Load new site from search bar
        function loadSite() {
            let url = input.value.trim();
            if (!url.startsWith('http')) url = 'https://' + url;
            frame.src = url;
        }

        // Fullscreen Toggle (Native + Mobile Fallback)
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) { /* Safari/iOS */
                    container.webkitRequestFullscreen();
                } else {
                    // Manual pseudo-fullscreen for stubborn mobile browsers
                    container.classList.toggle('pseudo-fullscreen');
                }
            } else {
                document.exitFullscreen();
            }
        }

        // Allow 'Enter' key to trigger search
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") loadSite();
        });
    </script>
</body>
</html>
